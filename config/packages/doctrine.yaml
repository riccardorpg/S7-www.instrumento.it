doctrine:
    dbal:
        # Database unico: amministrazione, notai e tutte le agenzie. I dati di un'agenzia
        # portano la FK company_id (CompanyOwnedInterface) e il filtro "company" li isola.
        url: '%env(resolve:DATABASE_URL)%'
        driver: 'pdo_mysql'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci
        profiling_collect_backtrace: '%kernel.debug%'

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore
        validate_xml_mapping: true
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        # Lo staff di un'agenzia vede solo le righe della propria (CompanyFilterListener lo accende).
        filters:
            company:
                class: App\Doctrine\Filter\CompanyFilter
                enabled: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
