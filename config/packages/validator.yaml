framework:
    validation:
        # Le regole stanno in YAML in config/validator/, una per entity, con i gruppi (CONVENZIONI 6):
        # mai constraint in attributi. Symfony legge quella cartella da sé (anche le sottocartelle
        # Master/ e Slave/, che separano le entity omonime come User): non va ripetuta qui,
        # altrimenti ogni regola viene caricata due volte.

when@test:
    framework:
        validation:
            not_compromised_password: false
