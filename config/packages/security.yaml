security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
        Symfony\Component\Security\Core\User\InMemoryUser:
            algorithm: plaintext

    providers:
        # Un solo login per tutti (amministratori, notai, staff agenzie): l'e-mail è unica.
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        script_provider:
            memory:
                users:
                    admin: { password: '%password_script%', roles: 'ROLE_SCRIPT' }

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets|build)/
            security: false
        script:
            pattern: ^/script
            http_basic:
                provider: script_provider
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            entry_point: App\Security\LoginFormAuthenticator
            user_checker: App\Security\UserChecker
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 settimana
            logout:
                path: logout
                target: login

    access_control:
        - { path: ^/script, roles: ROLE_SCRIPT }
        - { path: ^/amministratore, roles: ROLE_ADMIN }
        - { path: ^/notaio, roles: ROLE_NOTARY }
        - { path: ^/agenzia, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: bcrypt
                cost: 4
