# 4.1 Password resistente: almeno 10 caratteri, una maiuscola, una minuscola, una cifra e un
# carattere speciale (le stesse regole dell'indicatore nella pagina), più la conferma uguale.
App\Form\Model\PasswordCreate:
  properties:
    password:
      - NotBlank: { message: "Campo obbligatorio", groups: [password_create] }
      - Length: { min: 10, minMessage: "La password deve avere almeno 10 caratteri", groups: [password_create] }
      - Regex: { pattern: '/[A-Z]/', message: "Serve almeno una lettera maiuscola", groups: [password_create] }
      - Regex: { pattern: '/[a-z]/', message: "Serve almeno una lettera minuscola", groups: [password_create] }
      - Regex: { pattern: '/\d/', message: "Serve almeno una cifra", groups: [password_create] }
      - Regex: { pattern: '/[^A-Za-z0-9]/', message: "Serve almeno un carattere speciale", groups: [password_create] }
    passwordConfirm:
      - EqualTo: { propertyPath: password, message: "Le due password non coincidono", groups: [password_create] }
