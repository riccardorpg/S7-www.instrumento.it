# Crea licenza: tipo e quantità (le licenze nascono uguali, con scadenza a un anno).
App\Form\Model\LicenseNew:
  properties:
    type:
      - NotNull: { message: "Campo obbligatorio", groups: [license_new] }
    quantity:
      - NotNull: { message: "Campo obbligatorio", groups: [license_new] }
      - Range: { min: 1, max: 50, notInRangeMessage: "Da 1 a 50", groups: [license_new] }
