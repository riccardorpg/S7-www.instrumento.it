# Recupero password: basta un'e-mail valida. Se non è registrata il messaggio resta generico
# (lo decide il controller), così il form non dice quali indirizzi esistono.
App\Form\Model\PasswordRecover:
  properties:
    email:
      - NotBlank: { message: "Campo obbligatorio", groups: [password_recover] }
      - Email: { message: "E-mail non valida", groups: [password_recover] }
      - Length: { max: 191, maxMessage: "Massimo 191 caratteri", groups: [password_recover] }
