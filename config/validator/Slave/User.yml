# Utente dell'agenzia (staff). Gruppi:
# - client_staff: nuovo utente dalla scheda cliente dell'amministratore (nome, cognome, e-mail);
# - agency_staff: nuovo e modifica dall'area agenzia (anche il ruolo).
# L'e-mail è unica nel database dell'agenzia: UniqueEntity usa il manager della classe (lo slave
# già puntato sull'agenzia) ed esclude da sé il record in modifica.
App\Entity\Slave\User:
  constraints:
    - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity: { fields: email, errorPath: email, message: "E-mail già usata da un altro utente dell'agenzia", groups: [client_staff, agency_staff] }
  properties:
    name:
      - NotBlank: { message: "Campo obbligatorio", groups: [client_staff, agency_staff] }
      - Length: { max: 190, maxMessage: "Massimo 190 caratteri", groups: [client_staff, agency_staff] }
    surname:
      - NotBlank: { message: "Campo obbligatorio", groups: [client_staff, agency_staff] }
      - Length: { max: 190, maxMessage: "Massimo 190 caratteri", groups: [client_staff, agency_staff] }
    email:
      - NotBlank: { message: "Campo obbligatorio", groups: [client_staff, agency_staff] }
      - Email: { message: "E-mail non valida", groups: [client_staff, agency_staff] }
      - Length: { max: 190, maxMessage: "Massimo 190 caratteri", groups: [client_staff, agency_staff] }
    staffRole:
      - NotBlank: { message: "Campo obbligatorio", groups: [agency_staff] }
      - Choice: { choices: [admin, internal, external], message: "Ruolo non valido", groups: [agency_staff] }
