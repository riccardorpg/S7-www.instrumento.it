# Pratica (12.2), gruppo practice: inserimento e modifica (stesso form).
# Città e CAP arrivano dal picker condiviso, fuori dal form: li controlla il controller.
# Il notaio va cercato fra gli utenti del master: anche quello lo controlla il controller.
App\Entity\Slave\Practice:
  properties:
    seller:
      - NotNull: { message: "Campo obbligatorio", groups: [practice] }
    buyer:
      - NotNull: { message: "Campo obbligatorio", groups: [practice] }
      # Sull'acquirente (e non sulla classe) così l'errore si vede sul campo.
      - Expression:
          expression: "value === null or this.getSeller() === null or value !== this.getSeller()"
          message: "Venditore e acquirente non possono essere la stessa persona"
          groups: [practice]
    createdAt:
      - NotNull: { message: "Campo obbligatorio", groups: [practice] }
    address:
      - NotBlank: { message: "Campo obbligatorio", groups: [practice] }
      - Length: { max: 255, maxMessage: "Massimo 255 caratteri", groups: [practice] }
    notaryEmail:
      - Length: { max: 190, maxMessage: "Massimo 190 caratteri", groups: [practice] }
