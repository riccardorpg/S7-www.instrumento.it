# 13.3 Tag delle pratiche. Il valore è unico (collation case-insensitive: vale anche con altre maiuscole);
# il colore è un esadecimale #rrggbb (il controller lo porta in minuscolo dopo la validazione).
App\Entity\PracticeTag:
  constraints:
    - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity: { fields: [company, value], errorPath: value, message: "Esiste già un tag con questo valore", groups: [practice_tag] }
  properties:
    value:
      - NotBlank: { message: "Campo obbligatorio", groups: [practice_tag] }
      - Length: { max: 190, maxMessage: "Massimo 190 caratteri", groups: [practice_tag] }
    color:
      - NotBlank: { message: "Campo obbligatorio", groups: [practice_tag] }
      - Regex: { pattern: '/^#[0-9a-fA-F]{6}$/', message: "Colore non valido", groups: [practice_tag] }
